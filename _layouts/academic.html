<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% unless page.nav == 'Home' %}{{ page.title | escape }} | {% endunless %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  </head>
  <body class="page-{{ page.page_class | default: 'standard' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <nav class="site-nav" aria-label="Main navigation">
          {% for item in site.data.navigation.main %}
          <a href="{% if item.external %}{{ item.url | escape }}{% else %}{{ item.url | relative_url }}{% endif %}"{% if page.nav == item.title %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>
    <main id="main-content" class="site-main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title | escape }}</p>
    </footer>
  </body>
</html>
